[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stacy-assistant"
version = "0.1.0"
description = "A local conversational personal assistant"
requires-python = ">=3.11,<3.14"
dependencies = [
  "apscheduler>=3.11,<4",
  "fastmcp>=4.1,<5",
  "python-dotenv>=1,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
messaging = ["openai>=2,<4"]
voice = ["pipecat-ai[local,openai,mcp,tracing]>=1,<2"]
integrations = [
  "exa-py",
  "e2b-code-interpreter",
  "authlib",
  "httpx",
  "websockets>=15,<18",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
stacy = "stacy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stacy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
